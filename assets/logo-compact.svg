<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B61FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B61FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B61FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Terminal bracket with AI circuit -->
  <g transform="translate(20, 10)">
    <!-- Terminal bracket left -->
    <path d="M10 30 L25 50 L10 70" stroke="url(#grad2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Terminal bracket right -->
    <path d="M55 30 L40 50 L55 70" stroke="url(#grad3)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- AI circuit dot -->
    <circle cx="32" cy="50" r="4" fill="url(#grad1)"/>
    <!-- Circuit lines -->
    <line x1="32" y1="46" x2="32" y2="36" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="50" x2="46" y2="50" stroke="url(#grad3)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="33" r="2" fill="#00D4FF"/>
    <circle cx="49" cy="50" r="2" fill="#FF6B9D"/>
  </g>

  <!-- DEVBYAI text -->
  <text x="90" y="65" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="48" font-weight="700" fill="url(#grad1)" letter-spacing="-1">DEVBYAI</text>

  <!-- Tagline -->
  <text x="92" y="90" font-family="'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="14" fill="#8B8B9E" letter-spacing="3">FROM IDEA TO PRODUCTION</text>
</svg>
