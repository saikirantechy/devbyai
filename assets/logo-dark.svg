<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B61FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B61FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B61FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="200" rx="16" fill="#0D1117"/>

  <!-- Icon: Terminal bracket with AI circuit -->
  <g transform="translate(40, 30)">
    <!-- Terminal bracket left -->
    <path d="M10 40 L30 70 L10 100" stroke="url(#grad2)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Terminal bracket right -->
    <path d="M70 40 L50 70 L70 100" stroke="url(#grad3)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- AI circuit dot -->
    <circle cx="40" cy="70" r="6" fill="url(#grad1)"/>
    <!-- Circuit lines -->
    <line x1="40" y1="64" x2="40" y2="50" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="70" x2="60" y2="70" stroke="url(#grad3)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="47" r="3" fill="#00D4FF"/>
    <circle cx="63" cy="70" r="3" fill="#FF6B9D"/>
  </g>

  <!-- DEVBYAI text -->
  <text x="140" y="95" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="72" font-weight="700" fill="url(#grad1)" letter-spacing="-2">DEVBYAI</text>

  <!-- Tagline -->
  <text x="142" y="130" font-family="'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="22" fill="#8B8B9E" letter-spacing="4">FROM IDEA TO PRODUCTION</text>

  <!-- Decorative line -->
  <line x1="142" y1="145" x2="500" y2="145" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
