<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B61FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B61FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B61FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0D1117"/>

  <!-- Terminal bracket left -->
  <path d="M12 20 L24 32 L12 44" stroke="url(#grad2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Terminal bracket right -->
  <path d="M52 20 L40 32 L52 44" stroke="url(#grad3)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- AI circuit dot -->
  <circle cx="32" cy="32" r="4" fill="url(#grad1)"/>

  <!-- Circuit lines -->
  <line x1="32" y1="28" x2="32" y2="20" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="32" x2="44" y2="32" stroke="url(#grad3)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Circuit endpoints -->
  <circle cx="32" cy="17" r="2" fill="#00D4FF"/>
  <circle cx="47" cy="32" r="2" fill="#FF6B9D"/>
</svg>
